<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codeforces Daily Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🏆 Codeforces Daily Tracker</h1>
            <p class="subtitle">تتبع حلول الطلاب على Codeforces</p>
        </header>

        <div class="search-section">
            <div class="input-group">
                <input type="text" id="handleInput" placeholder="أدخل اسم الهاندل (مثال: YasserH2)" />
                <button id="searchBtn" onclick="searchUser()">
                    <span class="btn-text">بحث</span>
                    <span class="loader" id="loader"></span>
                </button>
            </div>
            <p class="hint">💡 الموقع هيعرض كل الأيام اللي فيها محاولات تلقائياً</p>
        </div>

        <div id="errorMessage" class="error-message hidden"></div>

        <div id="results" class="results hidden">
            <!-- User Summary -->
            <div class="user-summary">
                <h2 id="userHandle"></h2>
                <div class="summary-stats">
                    <span>📊 <strong id="totalSubmissions">0</strong> submission إجمالي</span>
                    <span>📅 <strong id="totalDays">0</strong> يوم نشاط</span>
                </div>
            </div>

            <!-- Days List -->
            <div id="daysList" class="days-list"></div>
        </div>

        <footer class="footer">
            <p>Powered by <a href="https://codeforces.com/apiHelp" target="_blank">Codeforces API</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
