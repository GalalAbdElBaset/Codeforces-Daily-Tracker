<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codeforces Daily Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🏆 Codeforces Daily Tracker</h1>
            <p class="subtitle">تتبع حلول الطلاب على Codeforces</p>
        </header>

        <div class="search-section">
            <div class="input-group">
                <input type="text" id="handleInput" placeholder="أدخل اسم الهاندل (مثال: tourist)" />
                <input type="date" id="dateInput" />
                <button id="searchBtn" onclick="searchUser()">
                    <span class="btn-text">بحث</span>
                    <span class="loader" id="loader"></span>
                </button>
            </div>
        </div>

        <div id="errorMessage" class="error-message hidden"></div>

        <div id="results" class="results hidden">
            <!-- Statistics Cards -->
            <div class="stats-grid">
                <div class="stat-card solved">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <span class="stat-value" id="solvedCount">0</span>
                        <span class="stat-label">مسائل محلولة</span>
                    </div>
                </div>
                <div class="stat-card wrong">
                    <div class="stat-icon">❌</div>
                    <div class="stat-info">
                        <span class="stat-value" id="wrongCount">0</span>
                        <span class="stat-label">محاولات خاطئة</span>
                    </div>
                </div>
                <div class="stat-card total">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <span class="stat-value" id="totalCount">0</span>
                        <span class="stat-label">إجمالي المحاولات</span>
                    </div>
                </div>
                <div class="stat-card unique">
                    <div class="stat-icon">🎯</div>
                    <div class="stat-info">
                        <span class="stat-value" id="uniqueCount">0</span>
                        <span class="stat-label">مسائل فريدة</span>
                    </div>
                </div>
            </div>

            <!-- Solved Problems Section -->
            <div class="section">
                <h2 class="section-title">
                    <span class="icon">✅</span>
                    المسائل المحلولة
                </h2>
                <div id="solvedProblems" class="problems-list"></div>
            </div>

            <!-- Wrong Submissions Section -->
            <div class="section">
                <h2 class="section-title">
                    <span class="icon">❌</span>
                    المحاولات الخاطئة
                </h2>
                <div id="wrongProblems" class="problems-list"></div>
            </div>
        </div>

        <footer class="footer">
            <p>Powered by <a href="https://codeforces.com/apiHelp" target="_blank">Codeforces API</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
